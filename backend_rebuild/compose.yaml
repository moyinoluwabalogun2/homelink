services:
  database:
    image: postgres:17-alpine
    container_name: homelink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: homelink
      POSTGRES_USER: homelink
      POSTGRES_PASSWORD: homelink
    ports:
      - "5432:5432"
    volumes:
      - homelink_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homelink -d homelink"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: homelink-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - homelink_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  homelink_postgres_data:
  homelink_redis_data: