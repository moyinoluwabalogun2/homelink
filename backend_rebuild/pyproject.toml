[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "homelink-backend"
version = "1.0.0"
description = "Production API for the HomeLink platform"
requires-python = ">=3.12,<3.15"

dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "SQLAlchemy>=2.0.35,<2.1",
  "alembic>=1.13,<2.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "PyJWT>=2.9,<3.0",
  "argon2-cffi>=23.1,<26.0",
  "email-validator>=2.2,<3.0",
  "redis>=5.0,<7.0",
  "httpx>=0.27,<1.0",
  "cloudinary>=1.46,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]