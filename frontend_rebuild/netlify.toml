[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Browser-security baseline for every page.
#
# Next.js needs inline scripts and styles for hydration, but every
# allowed external service remains explicitly restricted.
[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com; media-src 'self' blob: https://res.cloudinary.com; connect-src 'self' https://homelink-vo5e.onrender.com wss://homelink-vo5e.onrender.com https://api.cloudinary.com; font-src 'self' data:; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Long-lived immutable Next.js build assets.
[[headers]]
  for = "/_next/static/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache same-origin authentication proxy responses.
[[headers]]
  for = "/api/v1/auth/*"

  [headers.values]
    Cache-Control = "no-store, max-age=0"
    Pragma = "no-cache"
    X-Content-Type-Options = "nosniff"

# Never edge-cache authenticated pages.
[[headers]]
  for = "/dashboard/*"

  [headers.values]
    Cache-Control = "private, no-store, max-age=0"

[[headers]]
  for = "/admin/*"

  [headers.values]
    Cache-Control = "private, no-store, max-age=0"

[[headers]]
  for = "/post-listing/*"

  [headers.values]
    Cache-Control = "private, no-store, max-age=0"

[[headers]]
  for = "/payment/*"

  [headers.values]
    Cache-Control = "private, no-store, max-age=0"