version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: homelink
      POSTGRES_PASSWORD: password
      POSTGRES_DB: homelink_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - ./backend/.env
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
volumes:
  postgres_data: